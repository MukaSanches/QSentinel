name: QSentinel Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/QSentinel.Windows/QSentinel.Windows.csproj

      - name: Build
        run: dotnet build src/QSentinel.Windows/QSentinel.Windows.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          src/QSentinel.Windows/QSentinel.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload QSentinel
        uses: actions/upload-artifact@v4
        with:
          name: QSentinel-Windows-x64
          path: publish/
