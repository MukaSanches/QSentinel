name: QSentinel Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/QSentinel.Windows/QSentinel.Windows.csproj

      - name: Build
        run: dotnet build src/QSentinel.Windows/QSentinel.Windows.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          src/QSentinel.Windows/QSentinel.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\QSentinel.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: QSentinel-Portable-Windows-x64
          path: publish/QSentinel.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QSentinel-Setup-Windows-x64
          path: dist/QSentinel-Setup-x64.exe
