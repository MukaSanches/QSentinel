name: QSentinel Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/QSentinel.Windows/QSentinel.Windows.csproj

      - name: Build
        run: dotnet build src/QSentinel.Windows/QSentinel.Windows.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          src/QSentinel.Windows/QSentinel.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\QSentinel.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: QSentinel-Portable-Windows-x64
          path: publish/QSentinel.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QSentinel-Setup-Windows-x64
          path: dist/QSentinel-Setup-x64.exe

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "VERSION is empty."
          }

          $tag = "v$version"
          $title = "QSentinel $version"
          $installer = "dist/QSentinel-Setup-x64.exe"
          $portable = "publish/QSentinel.exe"

          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          if (-not (Test-Path $portable)) {
            throw "Portable executable not found: $portable"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Updating its downloadable files."
            gh release upload $tag $installer $portable --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            Write-Host "Creating release $tag."
            gh release create $tag $installer $portable --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }
